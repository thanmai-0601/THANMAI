<!-- Toggle Button -->
<button (click)="toggleChat()" class="chat-toggle-btn">
    <app-icon [name]="isOpen ? 'cross' : 'mail'" className="text-2xl"></app-icon>
    <span *ngIf="!isOpen" class="pulse-dot"></span>
</button>

<!-- Chat Window -->
<div *ngIf="isOpen" class="chat-window">
    
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-left">
            <div class="chat-header-icon">
                <app-icon name="shield" className="text-xl"></app-icon>
            </div>
            <div>
                <h3 class="chat-header-title">NexaLife AI</h3>
                <div class="chat-header-status">
                    <span class="dot"></span>
                    <span>Active Support</span>
                </div>
            </div>
        </div>
        <button (click)="toggleChat()" class="chat-close-btn">
            <app-icon name="cross" className="text-lg"></app-icon>
        </button>
    </div>

    <!-- Messages -->
    <div #scrollMe class="chat-messages">
        @for (msg of messages; track msg.timestamp) {
            <div class="msg-row" [ngClass]="msg.isBot ? 'bot' : 'user'">
                <div class="msg-bubble" [ngClass]="msg.isBot ? 'bot' : 'user'">
                    {{ msg.text }}
                </div>
                <span class="msg-time">
                    {{ msg.timestamp | date:'shortTime' }}
                </span>
            </div>
        }
        @if (loading) {
            <div class="msg-row bot">
                <div class="typing-indicator">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        }
    </div>

    <!-- Input -->
    <div class="chat-input-area">
        <form (ngSubmit)="sendMessage()" class="chat-input-form">
            <input type="text" 
                [(ngModel)]="message" 
                name="chatMsg"
                (keydown)="onKeydown($event)"
                [placeholder]="loading ? 'AI is thinking...' : 'Ask me anything...'"
                class="chat-input"
                [disabled]="loading">
            <button type="submit" 
                [disabled]="!message.trim() || loading"
                class="chat-send-btn">
                <app-icon name="arrow-right" className="text-sm"></app-icon>
            </button>
        </form>
    </div>
</div>
